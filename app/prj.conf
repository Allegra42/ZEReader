# https://docs.zephyrproject.org/latest/kconfig.html


# Peripherals
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=n
CONFIG_UC81XX=y

CONFIG_INPUT=y
CONFIG_INPUT_EVENT_DUMP=y

# Logging
CONFIG_LOG=y
CONFIG_ZEREADER_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# Memory Protection
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

# Disk Access
CONFIG_DISK_ACCESS=y

# File System
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LBA64=y
# Long file names (LFN)
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=255

# Memory Configuration
# Make sure the configured stack size matches the size of
# e.g. read buffer arrays!
CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=200000
CONFIG_IDLE_STACK_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048

# CONFIG_MAIN_STACK_SIZE=65536
# CONFIG_IDLE_STACK_SIZE=1024
# CONFIG_ISR_STACK_SIZE=4096

# --- Maximizing the Heap ---
# CONFIG_HEAP_MEM_POOL_SIZE=200000

# LVGL
CONFIG_LVGL=y
CONFIG_APP_LINK_WITH_LVGL=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_BUTTON_INPUT_MSGQ_COUNT=4
CONFIG_LV_COLOR_DEPTH_1=y

CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Use two rendering buffers
CONFIG_LV_Z_DOUBLE_VDB=y

CONFIG_LV_Z_FULL_REFRESH=n
# Huge RAM influence!
CONFIG_LV_Z_VDB_SIZE=100

CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_DRAW_SW_I1_LUM_THRESHOLD=65

CONFIG_LV_USE_LOG=y
